# Compila o app iOS num Mac do GitHub e envia ao TestFlight.
# Rodar: aba Actions > "App iOS (TestFlight)" > Run workflow  (ou: gh workflow run ios.yml)
# Segredos do repositório (Settings > Secrets and variables > Actions), cadastrados pelo dono da conta Apple:
#   APPLE_TEAM_ID   ID do time (developer.apple.com > Account > Membership)
#   ASC_KEY_ID      ID da chave da App Store Connect API (acesso Admin)
#   ASC_ISSUER_ID   Issuer ID da mesma tela
#   ASC_KEY_P8      conteúdo do arquivo AuthKey_XXXX.p8
name: App iOS (TestFlight)

on:
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão mostrada no TestFlight, por exemplo 1.0.0"
        required: false
        default: 1.0.0

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      BUNDLE_ID: br.com.magnaenecon.diagrama230
      VERSAO: ${{ github.event.inputs.versao || '1.0.0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dependências
        run: npm install --no-audit --no-fund

      - name: Arquivos do site para o app
        run: |
          mkdir -p www
          cp index.html app.js foto.js mapa.js banco.js drive.js snv-br230.js osm-br230.js fundo-br230.js tela-cheia.js logo.js dados-iniciais.js manifest.webmanifest www/
          cp -R lib icons www/
          # bibliotecas do PDF dentro do app (gera o PDF sem internet)
          cp node_modules/jspdf/dist/jspdf.umd.min.js node_modules/svg2pdf.js/dist/svg2pdf.umd.min.js www/lib/

      - name: Projeto iOS (Capacitor)
        run: |
          npx cap add ios
          npx cap sync ios
          # o identificador vem do capacitor.config.json; só confere (não passar na linha de comando: iria para as bibliotecas também)
          sed -i '' "s/io\.ionic\.starter/$BUNDLE_ID/g" ios/App/App.xcodeproj/project.pbxproj
          grep -m1 "PRODUCT_BUNDLE_IDENTIFIER" ios/App/App.xcodeproj/project.pbxproj

      - name: Ícone e permissões
        run: |
          PL=ios/App/App/Info.plist
          plutil -replace CFBundleDisplayName -string "VIA-230" "$PL"
          plutil -replace NSLocationWhenInUseUsageDescription -string "O app usa a sua posição para mostrar o km da BR-230 no mapa e identificar o ponto da foto." "$PL"
          plutil -replace NSCameraUsageDescription -string "A câmera é usada para tirar as fotos com carimbo dos pontos." "$PL"
          plutil -replace NSPhotoLibraryUsageDescription -string "A galeria é usada para escolher fotos e ler a localização gravada nelas." "$PL"
          plutil -replace NSPhotoLibraryAddUsageDescription -string "As fotos com carimbo são salvas na sua galeria." "$PL"
          plutil -replace ITSAppUsesNonExemptEncryption -bool NO "$PL"
          AS=ios/App/App/Assets.xcassets/AppIcon.appiconset
          rm -f "$AS"/*
          cp icons/icon-1024.png "$AS/icon-1024.png"
          printf '%s' '{"images":[{"filename":"icon-1024.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > "$AS/Contents.json"

      - name: Chave da App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          test -n "$ASC_KEY_ID" && test -n "$ASC_KEY_P8" || { echo "Faltam os segredos ASC_KEY_ID / ASC_KEY_P8 no repositório."; exit 1; }
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Compilar e assinar
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -d ios/App/App.xcworkspace ]; then P="-workspace ios/App/App.xcworkspace"; else P="-project ios/App/App.xcodeproj"; fi
          # assina já com o certificado de distribuição: o de desenvolvimento exigiria um iPhone cadastrado na conta
          xcodebuild $P -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic CODE_SIGN_IDENTITY="Apple Distribution" \
            MARKETING_VERSION="$VERSAO" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Enviar ao TestFlight
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Apagar a chave
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
