# Publica o site no Cloudflare Pages (projeto via-230), em dois endereços:
#   link oficial (equipe)  https://via-230.pages.dev/         <- ramo "producao"
#   prévia (testes)        https://via-230.pages.dev/previa/  <- ramo "main"
# A prévia usa o banco de teste (ambiente.js). Todo envio ao main atualiza só a prévia.
# Para publicar no link oficial a versão que está na prévia:
#   git push origin main:producao  e depois  gh workflow run pages.yml
# Também monta o pacote de atualização do app (iOS/Android) de cada ambiente, que o app baixa sozinho (atualizar.js):
#   <site>/app/versao.json + app-<commit>.zip (oficial)   e   <site>/previa/app/... (prévia)
# O ambiente cujo ramo ainda não tem ferramentas/montar-app.sh fica sem pacote (o app dele ainda não sabe se atualizar).
# Precisa do segredo CLOUDFLARE_API_TOKEN: sem ele, ou se o Cloudflare recusar o envio, a execução fica vermelha (o site e o
# pacote dos apps NÃO foram atualizados). No fim, confere que o versao.json no ar é o que acabou de ser montado.
# Endereço antigo (GitHub Pages, brunoleite120-pixel.github.io/diagrama-linear-br230): continua recebendo o mesmo site só
# enquanto o repositório for público, como ponte para os apps e atalhos antigos (o aviso-endereco.js manda trocar de endereço).
# Com o repositório privado (o plano grátis não tem Pages), esses passos são pulados sozinhos.
name: Site (oficial e prévia)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  montar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: producao
          path: oficial

      - uses: actions/checkout@v4
        with:
          ref: main
          path: previa

      - name: Juntar oficial e prévia
        run: |
          # data do último envio (horário de Belém) e o código curto do commit
          versao() { echo "$(TZ=America/Belem git -C "$1" log -1 --format=%cd --date=format-local:'%d/%m/%Y %H:%M') · $(git -C "$1" rev-parse --short HEAD)"; }
          copia() {
            mkdir -p "$2"
            rsync -a --exclude='.git' --exclude='.github' --exclude='.gitignore' --exclude='node_modules' \
              --exclude='package.json' --exclude='package-lock.json' --exclude='capacitor.config.json' --exclude='ferramentas' "$1"/ "$2"/
          }
          copia oficial _site
          rm -rf _site/previa
          copia previa _site/previa

          if [ -f _site/ambiente.js ]; then
            sed -i "s|^  var VERSAO = 'dev';|  var VERSAO = '$(versao oficial)';|" _site/ambiente.js
          fi

          A=_site/previa/ambiente.js
          sed -i "s|^  var NOME = 'oficial';|  var NOME = 'previa';|" "$A"
          sed -i "s|^  var VERSAO = 'dev';|  var VERSAO = '$(versao previa)';|" "$A"
          grep -q "var NOME = 'previa';" "$A" || { echo "A prévia ficou sem o ambiente de teste"; exit 1; }
          # na tela de início a prévia também se chama VIA-230 (decisão do usuário); só o nome longo diz que é a prévia
          sed -i 's|"name": "VIA-230 · Diagrama Linear BR-230"|"name": "VIA-230 · Diagrama Linear BR-230 (prévia)"|' _site/previa/manifest.webmanifest
          grep -q '(prévia)"' _site/previa/manifest.webmanifest || { echo "Não marquei a prévia no manifest"; exit 1; }

          grep -h "var NOME\|var VERSAO" _site/ambiente.js _site/previa/ambiente.js 2>/dev/null || true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pacotes de atualização do app
        run: |
          versao() { echo "$(TZ=America/Belem git -C "$1" log -1 --format=%cd --date=format-local:'%d/%m/%Y %H:%M') · $(git -C "$1" rev-parse --short HEAD)"; }
          # $1 = checkout do ramo, $2 = ambiente, $3 = pasta dele no site
          pacote() {
            if [ ! -f "$1/ferramentas/montar-app.sh" ]; then echo "$2: ramo ainda sem atualização do app pelo servidor"; return 0; fi
            (cd "$1" && npm install --no-audit --no-fund --ignore-scripts)
            W="$RUNNER_TEMP/www-$2"
            bash "$1/ferramentas/montar-app.sh" "$1" "$W" "$2" "$(versao "$1")"
            P=$(git -C "$1" rev-parse --short=7 HEAD)
            O=$(git -C "$1" log -1 --format=%ct)
            Z="app-$P.zip"
            mkdir -p "$3/app"
            (cd "$W" && zip -q -r -X "$GITHUB_WORKSPACE/$3/app/$Z" .)
            S=$(sha256sum "$3/app/$Z" | cut -d' ' -f1)
            T=$(stat -c %s "$3/app/$Z")
            jq -n --arg a "$2" --arg v "$P" --argjson o "$O" --arg z "$Z" --arg s "$S" --argjson t "$T" --arg x "$(versao "$1")"               '{ambiente: $a, versao: $v, ordem: $o, arquivo: $z, sha256: $s, tamanho: $t, texto: $x}' > "$3/app/versao.json"
            cat "$3/app/versao.json"
          }
          pacote oficial oficial _site
          pacote previa previa _site/previa

      - name: Publicar no Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b6dac35ea493329331f3298eeea3e1e1
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::Falta o segredo CLOUDFLARE_API_TOKEN: o site NÃO foi publicado"; exit 1; fi
          # confere a chave antes (só o tamanho e a resposta do Cloudflare; a chave em si não aparece no registro)
          echo "chave com ${#CLOUDFLARE_API_TOKEN} caracteres"
          R=$(curl -s -m 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify" || true)
          echo "$R" | head -c 400; echo
          echo "$R" | jq -e '.success == true' > /dev/null || { echo "::error::O Cloudflare recusou a chave: o site NÃO foi publicado"; exit 1; }
          npx --yes wrangler@4.20.0 pages deploy _site --project-name via-230 --branch producao --commit-dirty=true             --commit-message "oficial $(git -C oficial rev-parse --short HEAD) · prévia $(git -C previa rev-parse --short HEAD)"

      - name: Conferir o que está no ar
        run: |
          # o versao.json que acabou de ser montado tem de ser o que o Cloudflare entrega (é o que os apps leem)
          for s in "" "previa/"; do
            f="_site/${s}app/versao.json"
            [ -f "$f" ] || { echo "${s:-oficial/}: sem pacote do app"; continue; }
            v=$(jq -r .versao "$f")
            for i in 1 2 3 4 5 6; do
              no_ar=$(curl -s -m 20 "https://via-230.pages.dev/${s}app/versao.json?t=$(date +%s)" | jq -r '.versao // empty' 2>/dev/null || true)
              if [ "$no_ar" = "$v" ]; then echo "${s:-oficial/}: no ar $v"; break; fi
              if [ "$i" = 6 ]; then echo "::error::${s:-oficial/}app/versao.json no ar = '$no_ar', esperado '$v'"; exit 1; fi
              sleep 10
            done
          done

      # endereço antigo (GitHub Pages): só enquanto o repositório for público
      - if: ${{ !github.event.repository.private }}
        uses: actions/configure-pages@v5

      - if: ${{ !github.event.repository.private }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: montar
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
