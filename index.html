<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagrama Linear · Pontos Críticos</title>
<meta name="description" content="Pontos críticos da BR-230/PA: diagrama linear, mapa SNV com GPS e foto com carimbo.">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Diagrama 230">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --ground:#F1F3F1; --panel:#FFFFFF; --ink:#17201C; --ink-2:#3B4540; --ink-3:#5C6661;
  --line:#D5DAD6; --line-2:#E6E9E6; --accent:#1D4F91; --accent-ink:#FFFFFF; --accent-soft:#E7EEF7;
  --ok:#1E9E55; --ativo:#2B5797; --parado:#D93025; --danger:#B42318;
  --precisa:#F2A93B; --precisa-ink:#3D2800; --alerta:#7B3FA0;
  --radius:8px; --shadow:0 1px 2px rgba(23,32,28,.06),0 6px 24px rgba(23,32,28,.08);
  font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;background:var(--ground);color:var(--ink);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- barra superior ---------- */
.topbar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
/* app do iPhone (tela até a borda): a barra cobre a área do relógio e nada fica embaixo do recorte da tela.
   No navegador essas medidas são zero. */
.topbar{padding-top:calc(10px + env(safe-area-inset-top,0px));padding-left:calc(20px + env(safe-area-inset-left,0px));padding-right:calc(20px + env(safe-area-inset-right,0px))}
.layout{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{height:40px;width:auto}
.brand .eyebrow{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.brand h1{margin:0;font-size:17px;font-weight:650;line-height:1.2}
/* prévia (link /previa/): selo laranja ao lado do título; versão no fim do menu Dados */
.selo-previa{align-self:center;padding:3px 8px;border-radius:999px;background:#B54708;color:#fff;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.menu-versao{padding:6px 10px 4px;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.tabs{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 320px}
.tab{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;font-size:13px;white-space:nowrap}
.tab small{color:var(--ink-3);margin-left:6px}
.tab[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.tab[aria-current="true"] small{color:#C9D0CC}
.tab.add{border-style:dashed;color:var(--ink-2)}
.actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.save-state{font-size:12px;color:var(--ink-3);min-width:110px;text-align:right}
.save-state.warn{color:var(--danger)}

.btn{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 14px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font-size:13px;font-weight:550}
.btn:hover{background:#F6F7F6}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:#163E73}
.btn.small{min-height:30px;padding:4px 10px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--danger);border-color:#F0C7C2}
.btn.danger:hover{background:#FDF1EF}
.btn.danger-solid{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.danger-solid:hover{background:#912018}
.btn.danger-solid[disabled],.btn.primary[disabled]{opacity:.45;cursor:not-allowed}
.btn[disabled]{opacity:.6;cursor:progress}
.btn svg{width:16px;height:16px}

.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);min-width:250px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column}
.menu-pop[hidden]{display:none}
.menu-pop button{border:0;background:none;text-align:left;padding:9px 10px;border-radius:5px;font-size:13px}
.menu-pop button:hover{background:var(--ground)}
.menu-pop hr{border:0;border-top:1px solid var(--line-2);margin:4px 0}
.menu-pop .danger{color:var(--danger)}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:minmax(380px,460px) minmax(0,1fr);gap:0;min-height:calc(100vh - 61px)}
.layout.wide{grid-template-columns:minmax(0,1fr)}
.layout.wide .editor{display:none}
.editor{border-right:1px solid var(--line);background:var(--ground);padding:16px;display:flex;flex-direction:column;gap:14px;height:calc(100vh - 61px);overflow:auto;position:sticky;top:61px}
.preview{padding:16px 24px 40px;min-width:0}
.preview-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.preview-bar .meta{font-size:13px;color:var(--ink-3)}
.preview-tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.pages-ctl{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.pages-ctl select{min-height:32px;max-width:230px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);padding:2px 6px;font:inherit;font-weight:500}
.pages{display:flex;flex-direction:column;gap:20px}
.view-sw{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.view-sw button{border:0;background:none;min-height:32px;padding:4px 12px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.view-sw button+button{border-left:1px solid var(--line)}
.view-sw button[aria-pressed="true"]{background:var(--ink);color:#fff}
.map-host{height:calc(100vh - 140px);min-height:440px}
@media (max-width:700px){.map-host{height:72vh;min-height:380px}}
.sheet{background:#fff;box-shadow:var(--shadow);border-radius:2px;overflow:hidden}
.sheet svg{display:block;width:100%;height:auto}
.sheet [data-pid]{cursor:pointer}
.sheet [data-pid]:hover .blk{fill:#C9CFCB}

@media (max-width:1100px){
  .layout{grid-template-columns:1fr}
  .editor{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .layout.wide .editor{display:none}
  .actions{margin-left:0;flex-wrap:wrap}
}
@media (max-width:560px){
  .topbar{padding-left:calc(16px + env(safe-area-inset-left,0px));padding-right:calc(16px + env(safe-area-inset-right,0px))}
  .actions{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center}
  .save-state{min-width:0;text-align:left}
  #btnLogin{max-width:min(230px,60vw);min-width:0}
  #btnPdf{justify-content:center}
  .actions .menu{justify-self:stretch}
  #btnMenu{width:100%;justify-content:center}
}

/* ---------- editor ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.card-head{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:0;background:none;text-align:left;font-weight:650;font-size:14px}
.card-head .sub{font-weight:400;color:var(--ink-3);font-size:12.5px}
.chev{transition:transform .15s;flex:none}
[aria-expanded="true"] > .chev{transform:rotate(180deg)}
.card-body{padding:4px 14px 14px;display:flex;flex-direction:column;gap:12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.field .lbl{font-size:12px;color:var(--ink-3);font-weight:550}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:#fff;min-height:36px}
.field textarea{min-height:76px;resize:vertical}
.field input[readonly]{background:var(--ground);color:var(--ink-2)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);margin-top:4px}
.mini-row{display:grid;grid-template-columns:minmax(0,1fr) 92px 36px;gap:6px;align-items:end}
.dev-row{display:grid;grid-template-columns:minmax(0,1fr) 84px 92px 36px;gap:6px;align-items:end}
.icon-btn{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink-3)}
.icon-btn:hover{color:var(--danger);border-color:#F0C7C2;background:#FDF1EF}
.icon-btn svg{width:16px;height:16px}
.empty{font-size:12.5px;color:var(--ink-3)}

.points-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 2px}
.points-head h2{margin:0;font-size:15px}
.count{display:inline-block;min-width:22px;padding:0 7px;border-radius:999px;background:var(--line-2);font-size:12px;text-align:center;margin-left:6px;font-weight:600}
.hint{font-size:12px;color:var(--ink-3);padding:0 2px}
.pt-list{display:flex;flex-direction:column;gap:8px}
.pt{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.pt.open{border-color:#AFC2DA;box-shadow:0 0 0 3px var(--accent-soft)}
.pt-head{width:100%;display:grid;grid-template-columns:44px minmax(0,1fr) auto 46px 16px;align-items:center;gap:10px;padding:10px 12px;border:0;background:none;text-align:left}
.pt-name{font-weight:700;font-size:15px}
.pt-km{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt-dots{display:flex;gap:3px}
.dot{width:12px;height:12px;border-radius:3px}
.dot.OK{background:var(--ok)} .dot.A{background:var(--ativo)} .dot.P{background:var(--parado)} .dot.NA{background:#fff;box-shadow:inset 0 0 0 1px #B9C0BC}
.dot.PR{background:var(--precisa)} .dot.UR{background:var(--parado)} .dot.EX{background:var(--ativo)} .dot.NV{background:#E6E9E6;box-shadow:inset 0 0 0 1px #C9CECB}
.pt-pct{font-weight:650;font-variant-numeric:tabular-nums;text-align:right}
.pt-body{padding:2px 12px 14px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line-2)}
.pt-body .grid{margin-top:10px}

.svc{display:grid;grid-template-columns:108px minmax(0,1fr) 64px;gap:8px;align-items:center}
.svc-name{font-size:12.5px;font-weight:600}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;border-left:1px solid var(--line);background:#fff;padding:0 2px;font-size:12px;font-weight:600;color:var(--ink-2);min-height:32px}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"].OK{background:var(--ok);color:#fff}
.seg button[aria-pressed="true"].A{background:var(--ativo);color:#fff}
.seg button[aria-pressed="true"].P{background:var(--parado);color:#fff}
.seg button[aria-pressed="true"].NA{background:#59615D;color:#fff}
.seg button[aria-pressed="true"].PR{background:var(--precisa);color:var(--precisa-ink)}
.seg button[aria-pressed="true"].UR{background:var(--parado);color:#fff}
.seg button[aria-pressed="true"].EX{background:var(--ativo);color:#fff}
/* pontes: nome em cima; botões (5) e quantidade embaixo; "onde / o quê" quando precisa */
.svc.oae{grid-template-columns:minmax(0,1fr) 92px;row-gap:6px}
.svc.oae .svc-name{grid-column:1/-1}
.svc.oae .seg{grid-template-columns:repeat(5,minmax(0,1fr))}
.svc.oae .seg button{font-size:11.5px}
.svc-un,.svc-nv{font-size:11px;font-weight:500;color:var(--ink-3)}
.svc-nv{font-style:italic}
.svc-nota{grid-column:1/-1;width:100%;border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-height:32px;font-size:12.5px;background:#fff}
.svc-nota:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.sub-vis{font-size:11px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink-3)}
.pct-in{display:flex;align-items:center;gap:3px}
.pct-in input{width:100%;border:1px solid var(--line);border-radius:6px;padding:5px 6px;min-height:32px;text-align:right;font-variant-numeric:tabular-nums}
.pct-in input:disabled{background:var(--ground);color:#9AA19D}
.pct-in span{font-size:12px;color:var(--ink-3)}
.pt-foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pt-foot-l{display:flex;gap:8px;flex-wrap:wrap}
.gl-pend{min-width:18px;padding:0 5px;border-radius:999px;background:#B54708;color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center;font-variant-numeric:tabular-nums}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;box-shadow:var(--shadow);font-size:13px;max-width:min(560px,calc(100vw - 32px));z-index:4000;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.share-ready{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:4001;display:flex;align-items:center;gap:8px;flex-wrap:wrap;max-width:560px;margin:0 auto;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);font-size:13px}
.share-ready span{flex:1 1 200px;min-width:0;overflow-wrap:anywhere}

/* ---------- banco da equipe: só consulta, entrar, códigos, histórico ---------- */
.ro-note{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:10px 12px;border:1px solid #AFC2DA;border-radius:var(--radius);background:var(--accent-soft);font-size:13px;color:var(--ink-2)}
.ro-note span{flex:1 1 200px;min-width:0}
body.ro [data-act="add-point"],body.ro [data-act="dup-point"],body.ro [data-act="del-point"],body.ro [data-act="add-dev"],body.ro [data-act="del-dev"],
body.ro [data-act="add-marco"],body.ro [data-act="del-marco"],body.ro [data-act="del-contract"],body.ro [data-act="new-contract"]{display:none}
body.ro .seg button{cursor:default}
/* fiscal de campo: só os botões de status e o % dos serviços */
body.fiscal [data-act="add-point"],body.fiscal [data-act="dup-point"],body.fiscal [data-act="del-point"],body.fiscal [data-act="add-dev"],body.fiscal [data-act="del-dev"],
body.fiscal [data-act="add-marco"],body.fiscal [data-act="del-marco"],body.fiscal [data-act="del-contract"],body.fiscal [data-act="new-contract"]{display:none}
.fiscal-note{border-color:#E8C77A;background:#FDF6E3}
/* mudanças de fiscais aguardando aprovação */
.seg button.pend{box-shadow:inset 0 0 0 2px #C98A00;background:repeating-linear-gradient(135deg,#FFF4D6 0 6px,#fff 6px 12px);color:#7A5200}
.props{display:flex;flex-direction:column;gap:8px}
.prop{display:flex;flex-wrap:wrap;align-items:flex-start;gap:8px 12px;padding:9px 11px;border:1px solid #E8C77A;border-radius:8px;background:#FFFBEF;font-size:12.5px;color:var(--ink-2)}
.prop-txt{flex:1 1 220px;min-width:0}
.prop-txt ul,.ap-row ul{margin:4px 0 0;padding-left:18px}
.prop-tag{display:inline-block;padding:1px 7px;border-radius:999px;background:#C98A00;color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.prop-acts{display:flex;gap:6px}
.pt-prop{display:inline-block;width:8px;height:8px;margin-left:5px;border-radius:50%;background:#C98A00;vertical-align:middle}
/* contrato de pontes (CT 424) e análise das medições */
.pt.oae .pt-head{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) auto 46px 16px}
.pt.oae .pt-name{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt.oae .pt-pct{font-size:11.5px;white-space:nowrap}
.pt-pct.nec-urg{color:var(--parado)} .pt-pct.nec-prec{color:#9A5B00} .pt-pct.nec-exec{color:var(--ativo)} .pt-pct.nec-ok{color:var(--ok)} .pt-pct.nec-nv{color:var(--ink-3);font-weight:500}
.pt-al{display:inline-block;min-width:18px;padding:0 5px;margin-right:6px;border-radius:9px;background:var(--alerta);color:#fff;font-size:11px;font-weight:700;text-align:center;line-height:18px}
.svc-med{display:block;font-size:11px;font-weight:500;color:var(--ink-3)}
.svc-med.al{color:var(--alerta)}
.an-note{font-size:12.5px;color:var(--ink-2);background:var(--accent-soft);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px}
.an-card{padding:12px 14px;display:grid;gap:10px}
.an-head{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.an-head .sub{font-size:12px;color:var(--ink-3)}
.an-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.an-kpi{display:grid;gap:2px;background:var(--ground);border-radius:6px;padding:8px 10px}
.an-kpi span{font-size:11.5px;color:var(--ink-3)}
.an-kpi b{font-size:16px;font-variant-numeric:tabular-nums}
.an-kpi small{font-size:11.5px;color:var(--ink-2)}
.an-src{font-size:11.5px;color:var(--ink-3)}
.an-notas summary{cursor:pointer;font-size:12.5px;color:var(--accent)}
.an-notas ol{margin:6px 0 0;padding-left:18px;display:grid;gap:4px;font-size:12px;color:var(--ink-2)}
.an-line{font-size:12.5px;color:var(--ink-2)}
.an-over{color:var(--alerta)}
.an-gar{color:#8A6500;font-weight:600}
.an-bars{display:flex;align-items:flex-end;gap:2px;height:70px;padding-top:4px;border-bottom:1px solid var(--line)}
.an-bar{flex:1;height:100%;display:flex;align-items:flex-end}
.an-bar.corte{border-left:1px dashed var(--ink-3);padding-left:1px}
.an-bar i{display:block;width:100%;border-radius:2px 2px 0 0}
.an-bar i.on,.an-leg i.on{background:var(--ativo)}
.an-bar i.al,.an-leg i.al{background:var(--alerta)}
.an-axis{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--ink-3)}
.an-leg{display:flex;gap:12px;font-size:11px;color:var(--ink-3)}
.an-leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.an-table{display:grid;font-size:12.5px}
.an-tr{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;padding:6px 0;border-top:1px solid var(--line-2);font-variant-numeric:tabular-nums}
.an-tr span:nth-child(n+2){text-align:right;white-space:nowrap}
.an-tr small{display:block;font-size:11px;color:var(--ink-3)}
.an-th{font-size:11px;color:var(--ink-3);border-top:0}
.an-al{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:7px 0;border-top:1px solid var(--line-2);font-size:12.5px}
.an-al small{display:block;color:var(--ink-2);margin-top:2px}
.an-v{font-variant-numeric:tabular-nums;white-space:nowrap}
.an-sev{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;border:1px solid currentColor}
.an-sev.alta{color:var(--alerta)}
.an-sev.media{color:#8A6500}
.an-sev.baixa{color:var(--ink-3)}
.btn.aprov{border-color:#E8C77A;background:#FFF4D6;color:#7A5200}
.btn.aprov:hover{background:#FCEBBE}
.ap-list{display:flex;flex-direction:column;gap:6px}
.ap-row{display:flex;gap:10px;align-items:flex-start;padding:8px 2px;border-bottom:1px solid var(--line-2);font-size:13px}
.ap-row input{margin-top:3px}
/* listas da lixeira, cópias e usuários */
.modal-box.wide{max-width:600px}
.hint{font-size:12px;color:var(--ink-3);margin:0}
.lx,.us{display:flex;flex-direction:column;gap:4px}
.lx-row,.us-row{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.lx-txt,.us-txt{flex:1 1 240px;min-width:0;overflow-wrap:anywhere}
.lx-txt small,.us-txt small{display:block;color:var(--ink-3);font-size:12px;margin-top:2px}
.lx-acts{display:flex;gap:6px;flex-wrap:wrap}
.us-row.off .us-txt{opacity:.6}
.tag{display:inline-block;padding:1px 7px;border-radius:999px;background:var(--ground);border:1px solid var(--line);font-size:11px;font-weight:600;color:var(--ink-2)}
.tag.t-criador{background:#E7EEF7;border-color:#AFC2DA;color:#1D4F91}
.tag.t-engenheiro{background:#E6F4EC;border-color:#A9D6BC;color:#17633A}
.tag.t-fiscal{background:#FFF4D6;border-color:#E8C77A;color:#7A5200}
.tag.t-off{background:#FDF1EF;border-color:#F0C7C2;color:var(--danger)}
.papeis{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.papeis legend{font-size:12px;color:var(--ink-3);font-weight:550;margin-bottom:4px}
.papel-op{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;cursor:pointer}
.papel-op:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.papel-op small{display:block;color:var(--ink-3);font-size:12px;margin-top:2px}
.papel-op input{margin-top:3px}
.cod-row{display:flex;gap:6px}
.cod-row input{flex:1;min-width:0;font-family:ui-monospace,Consolas,monospace;letter-spacing:.06em}
.cod-show{font-family:ui-monospace,Consolas,monospace;font-size:26px;font-weight:700;letter-spacing:.12em;text-align:center;padding:14px;border:1px dashed var(--accent);border-radius:8px;background:var(--accent-soft);user-select:all}
.cf-dig input{font-family:ui-monospace,Consolas,monospace}
.field input:disabled,.field select:disabled,.field textarea:disabled{background:var(--ground);color:var(--ink-2);opacity:1}
#btnLogin{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;line-height:22px}
.modal{position:fixed;inset:0;z-index:3500;display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) calc(16px + env(safe-area-inset-left,0px));background:rgba(23,32,28,.42)}
/* iPhone: campo com letra menor que 16 px faz a página dar zoom ao tocar e ficar ampliada depois */
@media (pointer:coarse){input:not([type=checkbox]):not([type=radio]):not([type=range]),select,textarea{font-size:16px !important}}
.modal-box{width:100%;max-width:440px;max-height:calc(100% - 8px);overflow:auto;display:flex;flex-direction:column;gap:12px;padding:18px;background:var(--panel);border-radius:12px;box-shadow:var(--shadow)}
.modal-box h2{margin:0;font-size:17px;font-weight:650;text-wrap:balance}
.modal-box p{margin:0;color:var(--ink-2);font-size:13px}
.modal-err{color:var(--danger)!important;font-weight:550}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:4px}
.modal-list{display:flex;flex-direction:column;gap:8px}
.modal-list .btn{justify-content:flex-start}
.show-pw{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-3)}
.hist{display:flex;flex-direction:column;gap:2px;font-size:13px}
.hist-row{display:grid;grid-template-columns:86px minmax(0,1fr);gap:8px;padding:6px 0;border-bottom:1px solid var(--line-2)}
.hist-row span{min-width:0;overflow-wrap:anywhere}
.hist-when{color:var(--ink-3);font-variant-numeric:tabular-nums}
.hist-conf{display:block;margin-top:3px;padding-left:8px;border-left:2px solid #E5B800;color:var(--ink-2);font-size:12.5px}
.last-edit{font-size:12px;color:var(--ink-3);padding-top:10px}
.last-edit b{color:var(--ink-2);font-weight:600}
.card-body .last-edit{padding-top:0}
.conf-bar{align-items:flex-start;max-height:min(60vh,420px);overflow:auto;border-color:#E5B800;box-shadow:0 0 0 3px #FBF3D0,var(--shadow)}
.conf-body{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:4px}
.conf-body span{color:var(--ink-3)}
.conf-body ul{margin:4px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px;overflow-wrap:anywhere}

#pdfHost{position:fixed;left:-20000px;top:0;width:1191px;height:842px;overflow:hidden}
#printArea{display:none}
@media print{
  @page{size:420mm 297mm;margin:0}
  html,body{background:#fff}
  body > *:not(#printArea){display:none !important}
  #printArea{display:block}
  .print-sheet{width:420mm;height:297mm;break-after:page;page-break-after:always;overflow:hidden}
  .print-sheet:last-child{break-after:auto;page-break-after:auto}
  .print-sheet svg{width:420mm;height:297mm;display:block}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <img id="brandLogo" alt="Consórcio Magna/Enecon">
    <div>
      <div class="eyebrow">Supervisão · Pontos críticos</div>
      <h1>Diagrama linear</h1>
    </div>
  </div>
  <nav class="tabs" id="tabs" aria-label="Contratos"></nav>
  <div class="actions">
    <span class="save-state" id="saveState" aria-live="polite"></span>
    <button class="btn" id="btnLogin" type="button" hidden>Entrar para editar</button>
    <button class="btn primary" id="btnPdf" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
      Exportar PDF
    </button>
    <div class="menu">
      <button class="btn" id="btnMenu" type="button" aria-haspopup="true" aria-expanded="false">
        Dados
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="menu-pop" id="menuPop" hidden>
        <button type="button" data-act="backup">Salvar backup (.json)</button>
        <button type="button" data-act="restore">Abrir backup…</button>
        <button type="button" data-act="lixeira" hidden>Lixeira e cópias de segurança</button>
        <button type="button" data-act="aprovar" hidden>Aprovar mudanças dos fiscais</button>
        <button type="button" data-act="usuarios" hidden>Usuários e acessos</button>
        <hr>
        <button type="button" data-act="print">Imprimir ou salvar PDF pelo navegador</button>
        <hr>
        <button type="button" data-act="reset" class="danger">Restaurar dados iniciais</button>
      </div>
    </div>
  </div>
</header>

<main class="layout" id="layout">
  <aside class="editor" id="editor" aria-label="Edição do contrato"></aside>
  <section class="preview" aria-label="Pré-visualização do diagrama">
    <div class="preview-bar">
      <div class="meta" id="previewMeta"></div>
      <div class="preview-tools">
        <div class="view-sw" role="group" aria-label="Visualização"><button type="button" id="viewDiagrama" data-view="diagrama" aria-pressed="true">Diagrama</button><button type="button" id="viewMapa" data-view="mapa" aria-pressed="false">Mapa</button></div>
        <label class="pages-ctl" for="selPages">Páginas <select id="selPages" disabled><option>Automático</option></select></label>
        <button class="btn small" id="btnFoto" type="button" title="Foto com logo e legenda (km, coordenadas, ponto)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
          Foto
        </button>
        <button class="btn small" id="btnGaleria" type="button" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          Galeria<span class="gl-pend" hidden></span>
        </button>
        <button class="btn small" id="btnFull" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5"/><path d="M20 9V4h-5"/><path d="M4 15v5h5"/><path d="M20 15v5h-5"/></svg>
          Tela cheia
        </button>
        <button class="btn small" id="btnWide" type="button" aria-pressed="false">Ampliar diagrama</button>
      </div>
    </div>
    <div class="pages" id="pages"></div>
    <div class="map-host" id="mapHost" hidden></div>
  </section>
</main>

<div id="pdfHost" aria-hidden="true"></div>
<div id="printArea" aria-hidden="true"></div>
<input type="file" id="fileInput" accept=".json,application/json" hidden>
<div class="toast" id="toast" role="status"></div>

<script src="ambiente.js"></script>
<script src="logo.js"></script>
<script src="dados-iniciais.js"></script>
<script src="tela-cheia.js"></script>
<script src="lib/leaflet.js"></script>
<script src="snv-br230.js"></script>
<script src="osm-br230.js"></script>
<script src="fundo-br230.js"></script>
<script src="mapa.js"></script>
<script src="foto.js"></script>
<script src="banco.js"></script>
<script src="drive.js"></script>
<script src="galeria.js"></script>
<script src="app.js"></script>
<script>
  // app instalado (iPhone: Compartilhar > Adicionar à Tela de Início): abre sem internet depois da primeira visita
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { /* segue sem modo offline */ }); });
  }
</script>
</body>
</html>
