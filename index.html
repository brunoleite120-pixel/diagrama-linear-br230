<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diagrama Linear · Pontos Críticos</title>
<meta name="description" content="Pontos críticos da BR-230/PA: diagrama linear, mapa SNV com GPS e foto com carimbo.">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VIA-230">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
html{scroll-padding-top:calc(var(--topbar-h,0px) + 8px)}
:root{
  --ground:#F1F3F1; --panel:#FFFFFF; --ink:#17201C; --ink-2:#3B4540; --ink-3:#5C6661;
  --line:#D5DAD6; --line-2:#E6E9E6; --accent:#1D4F91; --accent-ink:#FFFFFF; --accent-soft:#E7EEF7;
  --ok:#178245; --ativo:#2B5797; --parado:#D93025; --danger:#B42318;
  --danificado:#F2A93B; --danificado-ink:#3D2800; --alerta:#7B3FA0;
  --radius:8px; --shadow:0 1px 2px rgba(23,32,28,.06),0 6px 24px rgba(23,32,28,.08);
  font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;background:var(--ground);color:var(--ink);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- barra superior ---------- */
.topbar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
/* app do iPhone (tela até a borda): a barra cobre a área do relógio e nada fica embaixo do recorte da tela.
   No navegador essas medidas são zero. */
.topbar{padding-top:calc(10px + env(safe-area-inset-top,0px));padding-left:calc(20px + env(safe-area-inset-left,0px));padding-right:calc(20px + env(safe-area-inset-right,0px))}
.layout{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{height:40px;width:auto}
.brand .eyebrow{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.brand h1{margin:0;font-size:17px;font-weight:650;line-height:1.2}
/* prévia (link /previa/): selo laranja ao lado do título; versão no fim do menu Dados */
.selo-previa{align-self:center;padding:3px 8px;border-radius:999px;background:#B54708;color:#fff;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.menu-versao{padding:6px 10px 4px;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.tabs{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 320px}
.tab{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;font-size:13px;white-space:nowrap}
.tab small{color:var(--ink-3);margin-left:6px}
.tab[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.tab[aria-current="true"] small{color:#C9D0CC}
.tab.add{border-style:dashed;color:var(--ink-2)}
/* contratos: um botão com o nome do contrato aberto; a lista desce separada por tipo, com "+ Contrato" no fim */
.ctmenu{position:relative}
.ctm-btn{display:inline-flex;align-items:center;gap:2px}
.ctm-seta{width:15px;height:15px;margin-left:6px;flex:none}
.ctm-btn[aria-expanded="true"] .ctm-seta{transform:rotate(180deg)}
.ctm-pop{position:absolute;left:0;top:calc(100% + 6px);z-index:40;min-width:290px;max-width:calc(100vw - 32px);max-height:min(70vh,560px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column}
.ctm-pop[hidden]{display:none}
.ctm-g{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:9px 10px 3px}
.ctm-i{border:0;background:none;text-align:left;padding:9px 10px;border-radius:5px;font-size:13.5px;display:flex;justify-content:space-between;align-items:baseline;gap:14px;white-space:nowrap}
.ctm-i small{color:var(--ink-3);font-size:12px}
.ctm-i:hover{background:var(--ground)}
.ctm-i[aria-current="true"]{background:var(--ground);font-weight:650;box-shadow:inset 3px 0 0 var(--ink)}
.ctm-i.add{color:var(--accent);font-weight:550}
.ctm-add hr{border:0;border-top:1px solid var(--line-2);margin:4px 0}
body.ro .ctm-add,body.fiscal .ctm-add{display:none}
/* cadastro: contratos do fiscal e do analista */
.us-cts{border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin:0;display:grid;gap:8px;min-width:0}
.us-cts legend{font-weight:650;padding:0 4px}
.us-cts .hint{margin:0}
.us-ct-todos{display:flex;gap:8px;flex-wrap:wrap}
.us-ct{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;padding:8px 0;border-top:1px solid var(--line-2)}
.us-ct-n{min-width:0;font-weight:600}
.us-ct-n small{display:block;font-weight:400;color:var(--ink-3)}
.us-ct-ops{display:flex;flex-wrap:wrap;gap:6px 14px}
.us-ct-ops label{display:flex;align-items:center;gap:6px;min-height:36px}
/* papéis (app.js, aplicaPapel): sem diagrama (fiscal; analista sem o acompanhamento do contrato), sem mapa (analista só com as
   medições: fica só a lista) e sem fotos (analista e quem não entrou). O banco confere de novo: aqui é só a tela */
body.sem-diagrama #viewDiagrama,body.sem-diagrama #btnPdf,body.sem-diagrama #menuPdf,body.sem-diagrama #pgNav [data-pg="diagrama"],
body.sem-diagrama [data-act="print"],body.sem-diagrama #selPages,body.sem-diagrama #folhaSw{display:none !important}
body.sem-diagrama.sem-mapa .preview,body.sem-mapa #pgNav [data-pg="mapa"],body.sem-mapa #viewMapa{display:none !important}
body.sem-diagrama.sem-mapa .layout{grid-template-columns:minmax(0,1fr)}
body.sem-diagrama.sem-mapa .editor{position:static;height:auto;border-right:0}
body.sem-fotos #btnFoto,body.sem-fotos #btnGaleria,body.sem-fotos #pgNav [data-pg="foto"],body.sem-fotos #pgNav [data-pg="galeria"],
body.sem-fotos [data-act="fotos-ponto"],body.sem-fotos [data-act="relfoto"]{display:none !important}
.actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.save-state{font-size:12px;color:var(--ink-3);min-width:110px;text-align:right}
.save-state.warn{color:var(--danger)}

.btn{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 14px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font-size:13px;font-weight:550}
.btn:hover{background:#F6F7F6}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:#163E73}
.btn.small{min-height:30px;padding:4px 10px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--danger);border-color:#F0C7C2}
.btn.danger:hover{background:#FDF1EF}
.btn.danger-solid{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.danger-solid:hover{background:#912018}
.btn.danger-solid[disabled],.btn.primary[disabled]{opacity:.45;cursor:not-allowed}
.btn[disabled]{opacity:.6;cursor:progress}
.btn svg{width:16px;height:16px}

.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);min-width:250px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column}
.menu-pop[hidden]{display:none}
.menu-pop button{border:0;background:none;text-align:left;padding:9px 10px;border-radius:5px;font-size:13px}
.menu-pop button:hover{background:var(--ground)}
.menu-pop hr{border:0;border-top:1px solid var(--line-2);margin:4px 0}
.menu-pop .danger{color:var(--danger)}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:minmax(380px,460px) minmax(0,1fr);gap:0;min-height:calc(100vh - var(--topbar-h,61px))}
.layout.wide{grid-template-columns:minmax(0,1fr)}
@media (max-width:700px){
  .tabs{flex:1 1 100%;flex-wrap:nowrap}   /* só 2 botões (Visão geral e o de contratos): sem rolagem, e a lista que desce não é cortada */
  .tabs{position:relative}
  .ctmenu{min-width:0;flex:0 1 auto;position:static}   /* a lista desce na largura da barra inteira, sem sair da tela */
  .ctm-pop{left:0;right:0;min-width:0;max-width:none}
  .ctm-btn{max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none}
  .tab small{display:none}   /* no celular a aba leva só o nome ("Pontos Críticos 314"); o Lote ou o nº fica no computador */
}

/* ---------- visão geral: todos os contratos em escala de km (visao.js); só na tela ---------- */
.tab-visao{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.tab-visao svg{width:16px;height:16px}
.visao{display:block;max-width:1480px;margin:0 auto;padding:16px calc(20px + env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) calc(20px + env(safe-area-inset-left,0px))}
.vg{display:flex;flex-direction:column;gap:14px}
.vg-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:4px 16px}
.vg-head h2{margin:0;font-size:21px;font-weight:650;line-height:1.25;text-wrap:balance}
.vg-head p{margin:2px 0 0;font-size:13px;color:var(--ink-2)}
.vg-tot{font-size:12.5px;color:var(--ink-3)}
.vg-tot b{color:var(--danger)}
/* texto só para leitor de tela (aviso do cartão aberto, #vgAviso) */
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.vg-box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-sizing:border-box}
/* barra do desenho: [Tudo] [Contratos ▾] e a caixa seletora logo abaixo, por cima do desenho (visao.js caixaContratos).
   Marcar vale na hora; a caixa fica aberta até "Contratos", "Pronto", Esc ou um toque fora. O símbolo de cada contrato é o
   da raia (losango: pontos críticos; faixa: conservação; círculo: pontes) */
.vg-ctw{position:relative;display:flex;min-width:0;max-width:100%}
.vg-pre .vg-ctb{display:inline-flex;align-items:center;min-width:0}
.vg-ctb span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.vg-pre .vg-ctb.on{background:var(--ink);color:#fff}
.vg-seta{flex:none;width:6px;height:6px;margin:-3px 2px 0 9px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg)}
.vg-ctb[aria-expanded="true"] .vg-seta{margin-top:3px;transform:rotate(-135deg)}
/* largura até 340 px, sem passar da borda da caixa do desenho no celular (a página não rola para o lado); por cima da
   folha do ponto do celular (15) e embaixo da barra do topo (20) */
.vg-pnl{position:absolute;top:calc(100% + 6px);left:0;z-index:16;width:min(340px,calc(100vw - 48px));display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 2px 6px rgba(23,32,28,.08),0 12px 32px rgba(23,32,28,.18)}
.vg-pnl-l{max-height:min(380px,55vh);overflow-y:auto;overscroll-behavior:contain;padding:4px 6px}
.vg-pg{margin:0;padding:6px 0 2px;border:0;min-width:0}
.vg-pg+.vg-pg{margin-top:2px;border-top:1px solid var(--line-2)}
.vg-pg legend{padding:2px 8px 2px;color:var(--vg-t)}
.vg-op{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 8px;border-radius:6px;cursor:pointer}
.vg-op:hover,.vg-op:focus-within{background:var(--ground)}
.vg-op input{flex:none;width:18px;height:18px;margin:0;accent-color:var(--ink);cursor:pointer}
/* símbolos de larguras diferentes numa casa fixa: os nomes ficam alinhados */
.vg-op-s{flex:none;display:flex;justify-content:center;width:14px}
.vg-op-t{display:grid;flex:1 1 auto;min-width:0}
.vg-op-t b{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vg-op.on .vg-op-t b{font-weight:700}
.vg-op-t small{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.vg-sb{display:block;flex:none;background:var(--vg-t)}
.vg-sb.pc{width:8px;height:8px;border-radius:1px;transform:rotate(45deg)}
.vg-sb.conserva{width:14px;height:5px;border-radius:1px}
.vg-sb.oae{width:9px;height:9px;border-radius:50%}
/* contrato que chegou depois da última escolha: fica desmarcado, com o selo */
.vg-novo{flex:none;padding:0 6px;border-radius:7px;background:#B54708;color:#fff;font-size:10px;font-weight:700;line-height:16px;letter-spacing:.03em}
.vg-pnl-p{display:flex;justify-content:flex-end;gap:8px;padding:8px 10px;border-top:1px solid var(--line-2)}
.vg-pnl-p .ghost{margin-right:auto;color:var(--accent)}
/* cor de cada tipo: título do grupo na caixa, símbolo e a borda do cartão */
.vg-pg.pc,.vg-ct.pc{--vg-t:#B3261E}
.vg-pg.conserva,.vg-ct.conserva{--vg-t:#1D4F91}
.vg-pg.oae,.vg-ct.oae{--vg-t:#59615D}
.vg-fora{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:-4px;font-size:12.5px;color:var(--ink-2)}
.vg-fora .btn{color:var(--accent)}
.vg-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.vg-ct{display:grid;gap:7px;min-width:0;align-content:start;border-top:3px solid var(--vg-t,var(--line))}
.vg-ct-h{display:flex;flex-direction:column;gap:1px;min-width:0}
.vg-ct-h h3{margin:0;font-size:15px;font-weight:650}
.vg-ct-h span{font-size:12px;color:var(--ink-3)}
.vg-ct-t{font-size:12.5px;color:var(--ink-2)}
.vg-ct-n{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px}
.vg-ct-n b{font-size:21px;font-weight:650;font-variant-numeric:tabular-nums}
.vg-ct-n span{font-size:12.5px;color:var(--ink-2)}
.vg-seg{display:flex;gap:2px;height:8px;border-radius:4px;overflow:hidden;background:var(--line-2)}
.vg-seg i{display:block}
.vg-ct-s{font-size:12.5px}
.vg-ct-a{display:flex;flex-wrap:wrap;gap:6px}
.vg-ct-a .ghost{color:var(--accent)}
.vg-filtros{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-start}
.vg-busca{display:grid;gap:4px;flex:1 1 240px;max-width:380px}
.vg-cap{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.vg-busca input{min-height:40px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font-size:14px}
.vg-res{display:grid;gap:2px}
.vg-res:empty{display:none}
.vg-res button{text-align:left;border:0;background:var(--ground);border-radius:5px;padding:9px 10px;font-size:13px}
.vg-res button:hover{background:var(--accent-soft)}
.vg-res-n{font-size:12.5px;color:var(--ink-3);padding:4px 2px}
.vg-res-f{color:#8A5A00;font-weight:600}
.vg-chips{display:grid;gap:6px;flex:1 1 280px}
.vg-chips>div{display:flex;flex-wrap:wrap;gap:6px}
.vg-chip{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:4px 11px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-size:12.5px}
.vg-chip i{width:10px;height:10px;border-radius:3px;box-sizing:border-box;flex:none}
.vg-chip.oae i{border-radius:50%}
.vg-chip b{font-variant-numeric:tabular-nums}
.vg-chip[aria-pressed="false"]{background:var(--ground);color:var(--ink-3);border-style:dashed}
.vg-chip[aria-pressed="false"] i{background:transparent!important;border:2px solid currentColor}
.vg-meio{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.vg-diag{flex:999 1 560px;min-width:0;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}   /* a coluna encolhe (min-width:0): a barra quebra em linhas e o texto de "Contratos" corta com reticências, sem a página rolar para o lado */
.vg-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.vg-pre{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.vg-pre button{min-height:34px;padding:4px 12px;border:0;border-right:1px solid var(--line);background:var(--panel);font-size:13px;font-weight:600;white-space:nowrap}
.vg-pre button:last-child{border-right:0}
.vg-pre button[aria-pressed="true"]{background:var(--ink);color:#fff}
/* o grupo corta o que passa da borda (overflow:hidden): o anel do foco fica por dentro do botão; no botão escuro, branco */
.vg-pre button:focus-visible{outline-offset:-4px}
.vg-pre button[aria-pressed="true"]:focus-visible,.vg-pre .vg-ctb.on:focus-visible{outline-color:#fff}
.vg-zoom{display:flex;gap:6px}
.vg-zoom button{width:36px;height:34px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font-size:17px;line-height:1}
.vg-faixa{margin-left:auto;font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.vg-nokm,.vg-av{margin:0;font-size:12.5px;color:#8A5A00}
.vg-mini{position:relative;display:block;width:100%;height:24px;border:1px solid var(--line-2);border-radius:5px;background:#F7F8F7;padding:0}
.vg-mini span{position:absolute;height:4px;border-radius:2px}
.vg-mini .vg-jan{top:-1px;bottom:-1px;height:auto;border:2px solid var(--accent);border-radius:4px;background:rgba(29,79,145,.08);box-sizing:border-box;min-width:6px}
.vg-plot{--vg-lab:168px;display:grid;touch-action:pan-y;-webkit-user-select:none;user-select:none;cursor:grab}
.vg-row{display:grid;grid-template-columns:var(--vg-lab) minmax(0,1fr)}
.vg-lab{align-self:center;display:grid;gap:1px;padding-right:10px;min-width:0}
.vg-lab b{font-size:13px;font-weight:650}
.vg-lab small{font-size:11.5px;color:var(--ink-3)}
.vg-lane .vg-lab b,.vg-lane .vg-lab small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vg-lab-s{font-size:11px;color:var(--ink-3);align-self:end;padding-bottom:4px}
.vg-trk{position:relative;overflow:hidden;min-width:0}
.vg-loc{height:46px}
.vg-loc .vg-trk span{position:absolute;white-space:nowrap;font-size:11.5px;color:var(--ink-2)}
.vg-loc .vg-trk i{position:absolute;width:1px;background:#9AA39E}
.vg-loc .vg-trk span.vg-loc-ponta{color:var(--ink-3);font-weight:600}
.vg-rod{height:18px;align-items:center}
.vg-asf{display:block;height:14px;border-radius:3px;background:#4A524E;position:relative;overflow:hidden}
.vg-asf::after{content:"";position:absolute;left:0;right:0;top:6px;height:2px;background:repeating-linear-gradient(90deg,#E9C46A 0 10px,transparent 10px 20px)}
.vg-lane{height:66px;border-bottom:1px solid #EEF0EE}
.vg-lane .vg-trk{height:100%}
.vg-grade{position:absolute;top:0;bottom:0;width:1px;background:#EEF0EE}
.vg-banda{position:absolute;top:26px;height:16px;background:#E3E8E4;border-radius:3px}
.vg-banda.oae{top:33px;height:2px;background:#C9D0CC;border-radius:0}
.vg-rot{position:absolute;top:4px;transform:translateX(-50%);font-size:11px;font-weight:600;color:var(--ink-2);white-space:nowrap;pointer-events:none}
.vg-mk{position:absolute;padding:0;margin:0;border:2px solid #fff;box-sizing:border-box;box-shadow:0 0 0 1px rgba(23,32,28,.35);cursor:pointer}
.vg-mk.barra{top:24px;height:20px;border:0;border-radius:2px;box-shadow:0 0 0 1px #fff;min-width:3px}
.vg-mk.simb{top:27px;width:14px;height:14px;margin-left:-7px;border-radius:2px;transform:rotate(45deg)}
.vg-mk.pino{top:26px;width:16px;height:16px;margin-left:-8px;border-radius:50%}

/* conservação: prazos e valores (PI) em dois grupos, o "a confirmar" com a borda tracejada. Cada item numa grade (.full ocupa
   a linha inteira); no celular, uma coluna. O botão da situação diz "confirmado" ou "a confirmar" */
.pz-grupo{display:flex;flex-direction:column;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.pz-grupo.prev{border:1.5px dashed #C9A54A;background:#FFFCF3}
.pz-gtit{font-size:12px;font-weight:600;color:var(--ink-2)}
.pz-item{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 8px;align-items:end}
.pz-item+.pz-item{padding-top:8px;border-top:1px solid var(--line-2)}
.pz-item .full{grid-column:1/-1}
.pz-acts{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:8px}
.pz-sit{min-height:32px;padding:4px 12px;border:1px dashed #C98A00;border-radius:999px;background:#FFF4D6;color:#7A5200;font-size:12px;font-weight:650}
.pz-sit[aria-pressed="true"]{border:1px solid var(--ok);background:#E6F4EC;color:#14663A}
@media (max-width:560px){.pz-item{grid-template-columns:minmax(0,1fr)}}
/* aviso no formulário do contrato (km do site igual ao do contrato, objeto maior que as 2 linhas do relatório) */
.hint.ct-aviso{padding:6px 9px;border:1px solid #E8C77A;border-radius:6px;background:#FDF6E3;color:#7A5200}
.hint.ct-aviso:empty{display:none}
/* conservação: km do contrato do marco, só para leitura, embaixo de "KM" */
.mk-c{display:block;font-size:11px;font-weight:400;white-space:nowrap}
.icon-btn{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink-3)}
.icon-btn:hover{color:var(--danger);border-color:#F0C7C2;background:#FDF1EF}
.icon-btn svg{width:16px;height:16px}
.empty{font-size:12.5px;color:var(--ink-3)}

.points-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 2px}
.points-head h2{margin:0;font-size:15px}
.count{display:inline-block;min-width:22px;padding:0 7px;border-radius:999px;background:var(--line-2);font-size:12px;text-align:center;margin-left:6px;font-weight:600}
.hint{font-size:12px;color:var(--ink-3);padding:0 2px}
.pt-list{display:flex;flex-direction:column;gap:8px}
.pt{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.pt.open{border-color:#AFC2DA;box-shadow:0 0 0 3px var(--accent-soft)}
.pt-head{width:100%;display:grid;grid-template-columns:44px minmax(0,1fr) auto 46px 16px;align-items:center;gap:10px;padding:10px 12px;border:0;background:none;text-align:left}
.pt-name{font-weight:700;font-size:15px}
.pt-km{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt-dots{display:flex;gap:3px}
.dot{width:12px;height:12px;border-radius:3px}
.dot.OK{background:var(--ok)} .dot.A{background:var(--ativo)} .dot.P{background:var(--parado)} .dot.NA{background:#fff;box-shadow:inset 0 0 0 1px #B9C0BC}
.dot.DN{background:var(--danificado)} .dot.EX{background:var(--ativo)} .dot.NV{background:#E6E9E6;box-shadow:inset 0 0 0 1px #C9CECB}
.pt-pct{font-weight:650;font-variant-numeric:tabular-nums;text-align:right}
@media (max-width:560px){
  .pt:not(.oae) .pt-head{grid-template-columns:minmax(0,1fr) auto 46px 16px;row-gap:1px}
  .pt:not(.oae) .pt-name{grid-column:1;grid-row:1}
  .pt:not(.oae) .pt-km{grid-column:1;grid-row:2;overflow:visible}
  .pt:not(.oae) .pt-dots{grid-column:2;grid-row:1 / span 2}
  .pt:not(.oae) .pt-pct{grid-column:3;grid-row:1 / span 2}
  .pt:not(.oae) .pt-head > .chev{grid-column:4;grid-row:1 / span 2}
}
.pt-body{padding:2px 12px 14px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line-2)}
.pt-body .grid{margin-top:10px}

.svc{display:grid;grid-template-columns:108px minmax(0,1fr) 64px;gap:8px;align-items:center}
.svc-name{font-size:12.5px;font-weight:600}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;border-left:1px solid var(--line);background:#fff;padding:0 2px;font-size:12px;font-weight:600;color:var(--ink-2);min-height:32px}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"].OK{background:var(--ok);color:#fff}
.seg button[aria-pressed="true"].A{background:var(--ativo);color:#fff}
.seg button[aria-pressed="true"].P{background:var(--parado);color:#fff}
.seg button[aria-pressed="true"].NA{background:#59615D;color:#fff}
.seg button[aria-pressed="true"].DN{background:var(--danificado);color:var(--danificado-ink)}
.seg button[aria-pressed="true"].EX{background:var(--ativo);color:#fff}
/* pontes: nome em cima; botões (4) e estimativa embaixo; "onde / o quê" quando danificado ou executando */
.svc.oae{grid-template-columns:minmax(0,1fr) 92px;row-gap:6px}

.svc.oae .seg{grid-template-columns:repeat(4,minmax(0,1fr))}
.svc.oae .seg button{font-size:11px;line-height:1.15;white-space:normal;overflow-wrap:anywhere;padding:3px 3px;min-height:38px}
.svc-marcas{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.marca{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:4px 10px 4px 6px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:12px;font-weight:600;color:var(--ink-2)}
.marca i{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;font-style:normal;font-size:11.5px;font-weight:800;border:1.5px solid currentColor}
.marca.pri i{color:#B42318} .marca.ci i{color:var(--ok)}
.marca.pri[aria-pressed="true"]{background:#FDECEA;border-color:#B42318;color:#8A1C12}
.marca.pri[aria-pressed="true"] i{background:#B42318;border-color:#B42318;color:#fff}
.marca.ci[aria-pressed="true"]{background:#E6F4EC;border-color:var(--ok);color:#14663A}
.marca.ci[aria-pressed="true"] i{background:#fff}

.marca.mne[aria-pressed="true"]{background:#2A1414;border-color:#2A1414;color:#fff}
.marca.mne[aria-pressed="true"] i{background:#fff;border-color:#fff;color:#2A1414}
/* ponte em duas abas (Vistoria | Medições), só para quem vê a análise */
.pt-abas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin-top:10px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.pt-abas button{min-height:44px;border:0;background:var(--panel);color:var(--ink);font:inherit;font-size:14.5px}
.pt-abas button+button{border-left:1px solid var(--line)}
.pt-abas button[aria-selected="true"]{background:var(--ink);color:#fff;font-weight:700}
.pt-conf{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border:1px solid #F0C7C2;border-radius:var(--radius);background:#FDF1EF;font-size:14px;line-height:1.4}
.pt-conf>b{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:#B42318}
.pt-conf-ir{align-self:flex-start;min-height:36px;padding:0;border:0;background:none;font:inherit;font-size:13.5px;font-weight:650;color:#B42318;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.pt-dados{border:1px solid var(--line);border-radius:var(--radius);background:#F7F8F7}
.pt-dados>summary{min-height:44px;display:flex;align-items:center;padding:0 12px;cursor:pointer;font-size:14px}
.pt-dados>summary span{margin-left:4px;color:var(--ink-3)}

/* itens do grupo marcados na vistoria (dano observado ou em execução) */
.svc-itens{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;padding:8px 10px 10px;border:1px solid #F3D9A4;border-radius:var(--radius);background:#FFFBF1}

.svc-it-t{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.svc-it-l{display:flex;flex-wrap:wrap;gap:6px}
.svc-it{min-height:40px;padding:4px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;font:inherit;font-size:13px;color:var(--ink);cursor:pointer;text-align:left}
.svc-it[aria-pressed="true"]{border-color:#E8C77A;background:#FFF4D6;color:#7A5200;font-weight:700}
.svc-it.outro{border-style:dashed;border-color:#8A928D;color:var(--ink-2)}
.svc-it.pend{box-shadow:inset 0 0 0 2px #C98A00}

.svc-it-med{grid-column:1/-1;display:flex;flex-direction:column;gap:2px;padding:6px 9px;border-radius:6px;background:#EEF8F2;font-size:12.5px;line-height:1.35;color:#0F5A31}
.svc-it-med .nunca{color:#B42318}
.svc-ult{display:inline-block;margin-left:4px;padding:1px 6px;border:1px solid #8CCBA6;border-radius:4px;background:#DDF1E5;color:#0F5A31;font-size:11px;font-weight:700;white-space:nowrap;vertical-align:1px}
.svc-ult.nunca{border:1px dashed #E0A39C;background:none;color:#B42318}
.an-nav{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:6px;align-items:center}
.an-nav-s{height:44px;border:1px solid var(--line);border-radius:22px;background:var(--panel);font:inherit;font-size:20px;line-height:1;color:var(--ink);cursor:pointer}
.an-nav-c{min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:22px;background:var(--panel);font:inherit;font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.an-nav-c.on{background:var(--ink);border-color:var(--ink);color:#DDE3DF;cursor:pointer}
.an-nav-c.on b{color:#fff}
.an-nav-c:disabled{opacity:1}
.an-nav-t{margin-top:-6px;text-align:center;font-size:12px;color:var(--ink-3)}
.seg.an-modo{grid-template-columns:repeat(2,minmax(0,1fr));border-radius:22px}
.seg.an-modo button{min-height:40px;font-size:13.5px}
.seg.an-modo button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.mg-lista{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.mg+.mg{border-top:1px solid var(--line-2)}
.mg.acesso{border-top:2px dashed #B9C2BC;background:#F7F8F7}
.mg-h{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto 16px;align-items:center;gap:8px;min-height:56px;padding:8px 12px;border:0;background:none;font:inherit;color:var(--ink);text-align:left;cursor:pointer}
.mg-n{display:flex;flex-direction:column;gap:2px;min-width:0}
.mg-n>b{font-size:15px}
.mg-s{display:flex;flex-wrap:wrap;gap:2px 8px;font-size:12.5px}
.mg-e.nv{font-style:italic;color:var(--ink-3)}
.mg-e.dn{font-weight:700;color:#7A5200;background:#FFF4D6;padding:0 5px;border-radius:3px}
.mg-e.ex{font-weight:600;color:var(--ativo)}
.mg-e.ok,.mg-e.na{color:var(--ink-2)}

.mg-t{display:flex;flex-direction:column;align-items:flex-end;gap:1px;font-variant-numeric:tabular-nums;white-space:nowrap}

.mg-b{padding:0 12px 10px}

.mg-l{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start}
.mg-nm{font-size:13.5px;line-height:1.3;color:var(--ink)}
.mg-q{display:flex;flex-direction:column;align-items:flex-end;gap:1px;font-variant-numeric:tabular-nums;white-space:nowrap}

.mg-obs{display:block;margin-top:2px;font-size:11.5px;color:var(--ink-3)}
.mg-det{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;margin-top:6px;padding:7px 10px;border:1px solid var(--line-2);border-radius:6px;background:var(--panel);font-size:12.5px;font-variant-numeric:tabular-nums}

.mg-det .es{color:var(--ink-3)}
.mg-det .es.an-over{color:var(--alerta);font-weight:700}
.an-rod{font-size:12px;line-height:1.4;color:var(--ink-3)}
/* resumo da análise: serviços medidos no contrato */
.sc-abc{display:flex;gap:2px;height:12px}
.sc-abc i{display:block;min-width:3px;background:var(--line)}
.sc-abc i:first-child{border-radius:4px 0 0 4px}

.sc-k.a{background:var(--accent);color:var(--accent-ink)}
.sc-k.b{background:var(--accent-soft);color:var(--accent)}

.sc-lista{padding:0 12px}

.sc-c summary{cursor:pointer;min-height:40px;display:flex;align-items:center;border-top:1px solid var(--line-2);font-size:12.5px;color:var(--accent)}
.svc-rest{display:inline-block;margin-left:4px;padding:1px 6px;border:1px solid #8CCBA6;border-radius:4px;background:#DDF1E5;color:#0F5A31;font-size:11px;font-weight:700;white-space:nowrap;vertical-align:1px}

.svc-un,.svc-nv{font-size:11px;font-weight:500;color:var(--ink-3)}
.svc-nv{font-style:italic}
.svc-nota{grid-column:1/-1;width:100%;border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-height:32px;font-size:12.5px;background:#fff}
.svc-nota:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.sub-vis{font-size:11px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink-3)}
.pct-in{display:flex;align-items:center;gap:3px}

.pt-foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;box-shadow:var(--shadow);font-size:13px;max-width:min(560px,calc(100vw - 32px));z-index:4000;opacity:0;pointer-events:none;transition:opacity .2s}

body.ro [data-act="add-marco"],body.ro [data-act="del-marco"],body.ro [data-act="del-contract"],body.ro [data-act="new-contract"],body.ro [data-act="preencher-trechos"],body.ro [data-act="gerar-segmentos"],

.props{display:flex;flex-direction:column;gap:8px}

.pt-prop{display:inline-block;width:8px;height:8px;margin-left:5px;border-radius:50%;background:#C98A00;vertical-align:middle}
/* contrato de pontes (CT 424) e análise das medições */
.pt.oae .pt-head{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) auto 54px 16px}
.pt.oae .pt-name{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.conf-body{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:4px}
.conf-body span{color:var(--ink-3)}
.conf-body ul{margin:4px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px;overflow-wrap:anywhere}

#pdfHost{position:fixed;left:-20000px;top:0;width:1191px;height:842px;overflow:hidden}
#printArea{display:none}
@media print{
  @page{size:420mm 297mm;margin:0}
  html,body{background:#fff}
  body > *:not(#printArea){display:none !important}
  #printArea{display:block}
  .print-sheet{width:420mm;height:297mm;break-after:page;page-break-after:always;overflow:hidden}
  .print-sheet:last-child{break-after:auto;page-break-after:auto}
  .print-sheet svg{width:420mm;height:297mm;display:block}
}
/* dedo: o ponto aberto com alvos de 44 px (no fim, para valer sobre as regras do editor). No celular em pé, os botões de
   situação descem para uma linha inteira embaixo do nome e do percentual (ao lado deles, 5 botões ficavam com 36 px) */
@media (pointer:coarse),(max-width:700px){
  .field input,.field select,.pct-in input,.svc-nota{min-height:44px}
  .seg button,.svc.oae .seg button,.svc-marcas button,.pt .btn,.section-title .btn,[data-act="add-point"]{min-height:44px}
}
@media (max-width:700px){
  .svc:not(.oae){grid-template-columns:minmax(0,1fr) 80px;row-gap:6px}
  .svc:not(.oae) .svc-name{grid-column:1;grid-row:1}
  .svc:not(.oae) .pct-in{grid-column:2;grid-row:1}
  .svc:not(.oae) .seg{grid-column:1/-1;grid-row:2}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <img id="brandLogo" alt="Consórcio Magna/Enecon">
    <div>
      <div class="eyebrow">Supervisão · Pontos críticos</div>
      <h1>Diagrama linear</h1>
    </div>
  </div>
  <nav class="tabs" id="tabs" aria-label="Contratos"></nav>
  <button type="button" class="tab ctm-curto" id="ctCurto" aria-label="Trocar de contrato"></button>
  <div class="atalhos" id="atalhos" role="group" aria-label="Ir para">
    <button type="button" data-ir="pontos" aria-pressed="true">Pontos</button><button type="button" data-ir="diagrama" aria-pressed="false">Diagrama</button><button type="button" data-ir="mapa" aria-pressed="false">Mapa</button>
  </div>

    <span class="save-state" id="saveState" aria-live="polite"></span>
    <button class="btn" id="btnLogin" type="button" hidden>Entrar para editar</button>

      <span class="btn-txt">Exportar PDF</span>
    </button>
    <div class="menu">
      <button class="btn" id="btnMenu" type="button" aria-expanded="false" aria-controls="menuPop" aria-label="Dados">
        <svg class="ic-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        <span class="btn-txt">Dados</span>
        <svg class="ic-desce" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="menu-pop" id="menuPop" hidden>
        <div class="menu-estado so-compacto" id="menuEstado" hidden></div>
        <button type="button" class="so-compacto" data-act="login" id="menuLogin" hidden>Entrar</button>
        <hr class="so-compacto" id="menuLoginHr" hidden>
        <button type="button" data-act="backup">Salvar backup (.json)</button>
        <button type="button" data-act="restore">Abrir backup…</button>
        <button type="button" data-act="lixeira" hidden>Lixeira e cópias de segurança</button>
        <button type="button" data-act="recusadas" hidden>Alterações recusadas</button>
        <button type="button" data-act="aprovar" hidden>Aprovar mudanças dos fiscais</button>
        <button type="button" data-act="usuarios" hidden>Usuários e acessos</button>
        <button type="button" data-act="cargamed" hidden>Carregar medições (arquivo)…</button>
        <hr>
        <button type="button" class="so-compacto" data-act="pdf" id="menuPdf">Exportar PDF (A3)</button>
        <button type="button" data-act="print">Imprimir ou salvar PDF pelo navegador</button>
        <button type="button" data-act="relfoto" hidden>Relatório fotográfico (PDF)</button>
        <hr>
        <button type="button" data-act="reset" class="danger">Restaurar dados iniciais</button>
      </div>
    </div>
  </div>
  <nav class="pgnav" id="pgNav" aria-label="Páginas" hidden>
    <button type="button" data-pg="pontos"><span class="pg-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg></span><span class="pg-t">Pontos</span></button>
    <button type="button" data-pg="diagrama"><span class="pg-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="M3 10h18M3 14.5h18M9 5v14M15 5v14"/></svg></span><span class="pg-t">Diagrama</span></button>
    <button type="button" data-pg="foto" class="pg-foto" title="Foto com logo e legenda (km, coordenadas, ponto)"><span class="pg-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span><span class="pg-t">Foto</span></button>
    <button type="button" data-pg="mapa"><span class="pg-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="m3 6 6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg></span><span class="pg-t">Mapa</span></button>
    <button type="button" data-pg="galeria" hidden><span class="pg-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span class="gl-pend" hidden></span></span><span class="pg-t">Galeria</span></button>
  </nav>
</header>

<main class="layout" id="layout">
  <aside class="editor" id="editor" aria-label="Edição do contrato"></aside>
  <section class="preview" aria-label="Pré-visualização do diagrama">
    <div class="preview-bar">
      <div class="meta" id="previewMeta"></div>
      <div class="preview-tools">
        <div class="view-sw" id="viewSw" role="group" aria-label="Visualização"><button type="button" id="viewDiagrama" data-view="diagrama" aria-pressed="true">Diagrama</button><button type="button" id="viewMapa" data-view="mapa" aria-pressed="false">Mapa</button></div>
        <div class="view-sw" id="folhaSw" role="group" aria-label="O que aparece na folha" hidden><button type="button" data-folha="vistoria" aria-pressed="false">Só vistoria</button><button type="button" data-folha="analise" aria-pressed="true">Com análise</button></div>
        <label class="pages-ctl" for="selPages">Páginas <select id="selPages" disabled><option>Automático</option></select></label>
        <button class="btn small" id="btnFoto" type="button" title="Foto com logo e legenda (km, coordenadas, ponto)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
          Foto
        </button>
        <button class="btn small" id="btnGaleria" type="button" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          Galeria<span class="gl-pend" hidden></span>
        </button>
        <button class="btn small" id="btnFull" type="button" aria-label="Tela cheia">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5"/><path d="M20 9V4h-5"/><path d="M4 15v5h5"/><path d="M20 15v5h-5"/></svg>
          <span class="btn-txt">Tela cheia</span>
        </button>
        <button class="btn small so-pg" id="btnPdfPg" type="button" aria-label="Exportar PDF" title="Exportar PDF">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
        </button>
        <button class="btn small" id="btnWide" type="button" aria-pressed="false">Ampliar diagrama</button>
      </div>
    </div>
    <div class="pages" id="pages"></div>
    <div class="map-host" id="mapHost" hidden></div>
  </section>
</main>

<script>
  // app instalado (iPhone: Compartilhar > Adicionar à Tela de Início): abre sem internet depois da primeira visita.
  // No app nativo (Capacitor) os arquivos já vêm no pacote e a atualização é a do atualizar.js: sem service worker
  // (no Android o app roda em https://localhost e registraria um), e um registrado por versão antiga sai
  (function () {
    if (!('serviceWorker' in navigator)) return;
    var C = window.Capacitor, nativo = !!(C && C.isNativePlatform && C.isNativePlatform());
    if (nativo) {
      if (navigator.serviceWorker.getRegistrations) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }, function () {});
      return;
    }
    if (location.protocol === 'https:') {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { /* segue sem modo offline */ }); });
    }
  })();
</script>
